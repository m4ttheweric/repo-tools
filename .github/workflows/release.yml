name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # version: fed to RT_VERSION for compile/build (must stay clean semver —
      # numeric_build() in build.sh rejects anything else). tag/artifact_version
      # carry the dispatch run number for display and filenames only.
      - name: Release metadata
        id: meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            ARTIFACT_VERSION="$VERSION"
            PUBLISH=true
          else
            TAG="v0.0.0-ci${GITHUB_RUN_NUMBER}"
            VERSION="0.0.0"
            ARTIFACT_VERSION="0.0.0-ci${GITHUB_RUN_NUMBER}"
            PUBLISH=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$ARTIFACT_VERSION" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Developer ID (required on a tag; ad-hoc on a dry run) ────────────────
      - name: Check signing secrets
        id: signing
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          PUBLISH: ${{ steps.meta.outputs.publish }}
        run: |
          if [ -n "$CERT_B64" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::Developer ID secrets missing — a tagged release must be signed and notarized"; exit 1
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::Developer ID secrets not configured — dry run will be ad-hoc signed"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.available == 'true'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/rt-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          trap 'rm -f "$CERT_PATH"' EXIT
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          [ -n "$SIGNING_IDENTITY" ] || { echo "::error::Developer ID Application certificate not found"; exit 1; }
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      # ── Inputs to the bundle ─────────────────────────────────────────────────
      # RT_VERSION here keeps the tag's "v" prefix — cli.ts's own contract
      # (see its RT_VERSION comment) expects that form for `rt --version`.
      - name: Compile rt (arm64)
        run: bun build --compile --target=bun-darwin-arm64 ./cli.ts --outfile dist/rt --define RT_VERSION='"${{ steps.meta.outputs.tag }}"'

      # ADVISORY, not blocking: the 86ms threshold has never been calibrated
      # against macos-15 (this runner) — continue-on-error keeps a bad
      # calibration from blocking every release. The measured number still
      # prints below. Drop continue-on-error once a real macos-15 baseline
      # sets the threshold (see scripts/bench-startup.ts).
      - name: Startup benchmark
        run: bun scripts/bench-startup.ts
        continue-on-error: true

      - name: Fetch bundled dependencies
        run: scripts/fetch-deps.sh arm64

      # bunx vsce package runs a Node CLI under Bun's Node-compat shim, which
      # this repo has already hit drift on (bunx --bun wrangler silently
      # no-ops); pin the runtime instead of trusting the runner image's
      # ambient node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build extension
        shell: bash
        run: |
          cd extensions/vscode/rt-context
          bun install
          bun run package
          RT_VSIX="$(ls "$PWD"/*.vsix 2>/dev/null | head -1)"
          [ -n "$RT_VSIX" ] || { echo "::error::no .vsix produced by bun run package"; exit 1; }
          echo "RT_VSIX=$RT_VSIX" >> "$GITHUB_ENV"

      # ── The app (build.sh signs inside-out with the imported identity) ───────
      - name: Build mattstack.app
        env:
          RT_DAEMON_BIN: ${{ github.workspace }}/dist/rt
          RT_VERSION: ${{ steps.meta.outputs.version }}
          RT_REQUIRE_DEPS: "1"
          RT_BUILD_TOOL: swift
        run: rt-tray/build.sh release

      - name: Assert the bundle contract
        run: rt-tray/check-bundle.sh --app rt-tray/mattstack.app

      # Skipped on dispatch: the synthetic dry-run tag is not the stamped
      # version by design (see Release metadata), so there is nothing to assert.
      - name: Assert tag matches the stamped version
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' rt-tray/mattstack.app/Contents/Info.plist)"
          RT_OUT="$(dist/rt --version)"
          RT_TOKEN="${RT_OUT#rt }"; RT_TOKEN="${RT_TOKEN#v}"
          [ "$PLIST_VERSION" = "$VERSION" ] || { echo "::error::CFBundleShortVersionString '$PLIST_VERSION' != tag version '$VERSION'"; exit 1; }
          [ "$RT_TOKEN" = "$VERSION" ] || { echo "::error::rt --version '$RT_OUT' != tag version '$VERSION'"; exit 1; }

      - name: Notarize and staple the app
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: scripts/release/notarize.sh rt-tray/mattstack.app

      # After notarize, not before: this asserts what a user's machine
      # enforces on first launch (stapled ticket + an offline Gatekeeper
      # accept), which the pre-notarize contract check cannot see.
      - name: Assert Gatekeeper accepts the notarized app
        run: rt-tray/check-bundle.sh --app rt-tray/mattstack.app --notarized

      # ── Artifacts ────────────────────────────────────────────────────────────
      - name: Make zip
        shell: bash
        env:
          ARTIFACT_VERSION: ${{ steps.meta.outputs.artifact_version }}
        run: |
          mkdir -p out
          scripts/release/make-zip.sh rt-tray/mattstack.app "out/mattstack-${ARTIFACT_VERSION}.zip"

      # Gate: nothing below this step (dmg, notarize, appcast, publish) runs
      # unless a fresh runner can install and verify from this exact zip.
      - name: Clean-room install + verify
        run: scripts/e2e-cleanroom.sh out/mattstack-*.zip

      - name: Make dmg
        env:
          ARTIFACT_VERSION: ${{ steps.meta.outputs.artifact_version }}
        run: scripts/release/make-dmg.sh rt-tray/mattstack.app "out/mattstack-${ARTIFACT_VERSION}.dmg" "${SIGNING_IDENTITY:-}"

      - name: Notarize and staple the dmg
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ARTIFACT_VERSION: ${{ steps.meta.outputs.artifact_version }}
        run: scripts/release/notarize.sh "out/mattstack-${ARTIFACT_VERSION}.dmg"

      # Runs on every trigger (not just publish): dry runs rehearse Sparkle
      # signing/deltas too, so that machinery is proven before a real tag needs it.
      - name: Appcast (signed, with deltas)
        shell: bash
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          [ -n "$SPARKLE_ED_KEY" ] || { echo "::error::SPARKLE_ED_KEY secret missing"; exit 1; }
          scripts/release/appcast.sh out "${{ steps.meta.outputs.tag }}"

      # appcast.xml has no glob metacharacters, so nullglob can't prune it the
      # way it prunes the wildcard classes — it needs its own -e test or an
      # absent appcast.xml ships as a literal missing filename to shasum.
      - name: Checksums
        shell: bash
        working-directory: out
        run: |
          shopt -s nullglob
          files=()
          for class in 'mattstack-*.dmg' 'mattstack-*.zip' '*.delta'; do
            matches=($class)
            if [ ${#matches[@]} -eq 0 ]; then
              echo "note: no $class in out/ — skipping"
            else
              files+=("${matches[@]}")
            fi
          done
          if [ -e appcast.xml ]; then
            files+=(appcast.xml)
          else
            echo "note: no appcast.xml in out/ — skipping"
          fi
          [ ${#files[@]} -gt 0 ] || { echo "::error::out/ is empty — nothing to checksum"; exit 1; }
          shasum -a 256 "${files[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Cleanup keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      # ── Publish ──────────────────────────────────────────────────────────────
      # RELEASE_NOTES.md is committed by the release skill at the tagged commit;
      # this fallback keeps a hand-pushed tag (no skill run) publishing anyway.
      - name: Ensure release notes exist
        if: steps.meta.outputs.publish == 'true'
        run: '[ -f RELEASE_NOTES.md ] || echo "Release ${GITHUB_REF_NAME}." > RELEASE_NOTES.md'

      - name: Assert release assets are complete
        if: steps.meta.outputs.publish == 'true'
        shell: bash
        env:
          ARTIFACT_VERSION: ${{ steps.meta.outputs.artifact_version }}
        run: |
          test -f "out/mattstack-${ARTIFACT_VERSION}.zip" || { echo "::error::missing zip"; exit 1; }
          test -f "out/mattstack-${ARTIFACT_VERSION}.dmg" || { echo "::error::missing dmg"; exit 1; }
          test -f out/appcast.xml || { echo "::error::missing appcast.xml"; exit 1; }
          test -f out/SHA256SUMS || { echo "::error::missing SHA256SUMS"; exit 1; }

      - name: Create Release
        if: steps.meta.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          body_path: RELEASE_NOTES.md
          files: |
            out/mattstack-*.dmg
            out/mattstack-*.zip
            out/*.delta
            out/appcast.xml
            out/SHA256SUMS

      - name: Upload dry-run artifacts
        if: steps.meta.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: out/
          retention-days: 7
