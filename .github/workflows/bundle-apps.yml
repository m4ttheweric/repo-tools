name: Bundle apps

on:
  workflow_dispatch:
    inputs:
      apps:
        description: Comma-separated app names, or "all"
        required: true
        default: all
      dry_run:
        description: Build and hash only; skip release and PR
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - id: plan
        env:
          APPS_INPUT: ${{ inputs.apps }}
        run: echo "matrix=$(bun scripts/bundle-ci/plan-matrix.ts "$APPS_INPUT")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Clone app repo at main
        env:
          GH_TOKEN: ${{ secrets.MATTSTACK_RELEASE_TOKEN }}
          APP_REPO: ${{ matrix.repo }}
        run: |
          gh repo clone "$APP_REPO" app -- --depth 1 --branch main
          echo "SOURCE_SHA=$(git -C app rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Read and validate bundle recipe
        run: |
          bun scripts/bundle-ci/validate-manifest.ts app/mattstack.deck.json > recipe.json
          {
            echo "BUILD_CMD=$(bun -e 'console.log(JSON.parse(await Bun.file("recipe.json").text()).build)')"
            echo "ARTIFACT=$(bun -e 'console.log(JSON.parse(await Bun.file("recipe.json").text()).artifact)')"
            echo "VERSION=$(bun -e 'console.log(JSON.parse(await Bun.file("app/package.json").text()).version)')"
          } >> "$GITHUB_ENV"
      - name: Refuse an already-released version
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.MATTSTACK_RELEASE_TOKEN }}
          APP_REPO: ${{ matrix.repo }}
        run: |
          if gh api "repos/$APP_REPO/releases/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::v$VERSION already released on $APP_REPO; bump the version"
            exit 1
          fi
      - name: Build
        working-directory: app
        run: bash -c "$BUILD_CMD"
      - name: Smoke and package
        env:
          APP_NAME: ${{ matrix.name }}
          APP_REPO: ${{ matrix.repo }}
        run: |
          test -x "app/$ARTIFACT" || { echo "::error::bundle.artifact app/$ARTIFACT missing or not executable"; exit 1; }
          "app/$ARTIFACT" --version
          mkdir stage
          cp "app/$ARTIFACT" "stage/$APP_NAME"
          if [ -d app/skills ]; then cp -R app/skills stage/skills; fi
          TGZ="$APP_NAME-darwin-arm64.tgz"
          tar czf "$TGZ" -C stage .
          SHA=$(shasum -a 256 "$TGZ" | cut -d' ' -f1)
          URL="https://github.com/$APP_REPO/releases/download/v$VERSION/$TGZ"
          printf '{"name":"%s","version":"%s","url":"%s","sha256":"%s","sourceSha":"%s"}\n' \
            "$APP_NAME" "$VERSION" "$URL" "$SHA" "$SOURCE_SHA" > "result-$APP_NAME.json"
          cat "result-$APP_NAME.json"
      - name: Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.MATTSTACK_RELEASE_TOKEN }}
          APP_NAME: ${{ matrix.name }}
          APP_REPO: ${{ matrix.repo }}
        run: |
          gh release create "v$VERSION" "$APP_NAME-darwin-arm64.tgz" \
            --repo "$APP_REPO" \
            --title "$APP_NAME v$VERSION" \
            --notes "darwin-arm64 bundle build from $SOURCE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.name }}
          path: result-${{ matrix.name }}.json

  pr:
    needs: build
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MATTSTACK_RELEASE_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
      - name: Update deps.lock and open PR
        env:
          GH_TOKEN: ${{ secrets.MATTSTACK_RELEASE_TOKEN }}
        run: |
          bun -e '
            const files = [...new Bun.Glob("result-*.json").scanSync(".")];
            const results = await Promise.all(files.map(async (f) => JSON.parse(await Bun.file(f).text())));
            await Bun.write("results.json", JSON.stringify(results));
          '
          bun scripts/bundle-ci/update-lock.ts results.json
          BRANCH="bundle-ci/${{ github.run_id }}"
          git config user.name "bundle-apps workflow"
          git config user.email "noreply@github.com"
          git checkout -b "$BRANCH"
          git add rt-tray/deps.lock
          # shellcheck disable=SC2016
          BODY=$(bun -e '
            const rs = JSON.parse(await Bun.file("results.json").text());
            console.log(rs.map((r) => `- ${r.name} v${r.version} (source ${r.sourceSha.slice(0, 10)})`).join("\n"));
          ')
          git commit -m "deps.lock: bundle build $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create --title "deps.lock: app bundle build" --body "$BODY"
